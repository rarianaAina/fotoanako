<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />

    <!--
      Polices auto-hébergées : plus aucune requête vers un tiers. Archivo est
      variable — un seul fichier couvre 400 à 700, d'où l'unique préchargement.
      Le mono n'est préchargé nulle part : il ne sert qu'aux données, plus bas
      dans la page.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/k3kPo8UDI-1M0wlSV9XAw6lQkqWY8Q82sLydOxI.woff2"
      crossorigin
    />

    <!--
      Fond posé avant le chargement du CSS, pour éviter l'éclair blanc entre
      le premier octet et la feuille de style. Une seule déclaration : tout le
      reste vit dans src/index.css.
    -->
    <style>
      html { background: hsl(40 14% 97%); }
      @media (prefers-color-scheme: dark) {
        html { background: hsl(30 8% 9%); }
      }
    </style>

    <!--
      Titre et description génériques. BusinessConfigProvider les remplace par
      ceux de l'entreprise dès que la configuration est chargée.
    -->
    <title>Prise de rendez-vous en ligne</title>
    <meta name="description" content="Réservez votre rendez-vous en ligne." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
